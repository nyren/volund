name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean
        run: ./build.sh clean

      - name: Init
        run: ./build.sh init

      - name: Lint
        run: ./build.sh lint

      - name: Build
        run: ./build.sh build

      - name: Upload SVG
        uses: actions/upload-artifact@v7
        with:
          name: example-core-svg
          path: .build/example-core.svg

  # Verify with both podman and docker
  test:
    name: verify (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean
        run: ./build.sh clean

      - name: Init
        run: ./build.sh init

      - name: Verify
        env:
          VOLUND_RUNTIME: ${{ matrix.runtime }}
        run: ./build.sh verify

  deploy:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download SVG
        uses: actions/download-artifact@v8
        with:
          name: example-core-svg
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
